[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "devpilot-ai"
version = "0.1.0"
description = "Autonomous AI software engineering agent: turns an issue into a tested patch inside a sandboxed workspace."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bharatkumar Chandvani" }]
requires-python = ">=3.11"
keywords = ["ai", "llm", "ai-agents", "software-engineering", "code-generation", "autonomous-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # the sandbox runs Python test suites with the server's own interpreter
  "pytest>=8",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # starlette suggests a future httpx successor for TestClient; httpx is what we ship with
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/devpilot"]
